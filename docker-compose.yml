services:
  boinc-client:
    build: .
    image: boinc-client-runtime
    container_name: boinc-client
    env_file:
      - ./config/generated.env
    volumes:
      - ./boinc-data:/var/lib/boinc
    command: >
      bash -c "echo \"$$BOINC_CLIENT_RPC_PASSWORD\" > /var/lib/boinc/gui_rpc_auth.cfg &&
               boinc --dir /var/lib/boinc --allow_remote_gui_rpc"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
