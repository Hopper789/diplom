# Основная конфигурация кластера.
# Скопируй этот файл в config/cluster.yml и измени значения под свои машины:
#   cp config/cluster.example.yml config/cluster.yml
#   nano config/cluster.yml

project:
  # Имя BOINC-проекта. Оно становится частью URL:
  # http://SERVER_IP:8080/my_project/
  name: my_project
  port: 8080

server:
  # IP-адрес машины, на которой запускаются Docker-контейнеры сервера BOINC.
  # Этот IP должен быть доступен с каждого клиентского узла.
  ip: 192.168.1.10

# Необязательно. Дефолтные SSH-параметры для всех клиентов.
# clients_defaults:
#   port: 2222
# Также поддерживается глобальная форма:
# ssh:
#   port: 2222

clients:
  # Вычислительные узлы. Ansible подключается к ним по SSH.
  # На каждом узле должен быть включён SSH-сервер и пользователь с sudo-доступом.
  - name: node1
    ip: 192.168.1.11
    user: ubuntu
  - name: node2
    ip: 192.168.1.12
    user: ubuntu
    # Необязательно. Если не указан, Ansible использует стандартный SSH-порт 22.
    # port: 2222
    # Также поддерживается имя:
    # ssh_port: 2222

boinc:
  # Пароль RPC для BOINC-клиента внутри клиентских контейнеров.
  # Значение "auto" означает, что init_config.sh сгенерирует пароль.
  client_rpc_password: auto

account:
  # Одна учётная запись BOINC используется для подключения всех клиентов к проекту.
  # create_account_db.sh создаёт её напрямую в MariaDB и сохраняет ключ authenticator.
  email: nodes@local.test
  name: nodes
  password: manual
