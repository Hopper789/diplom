---
- name: Install and attach BOINC clients in Docker
  hosts: boinc_clients
  become: true
  gather_facts: true

  vars:
    boinc_client_data_dir: /opt/boinc-client
    boinc_client_image: local/boinc-client:ubuntu24
    boinc_client_base_image: ubuntu:24.04
    boinc_client_reset_state: false

  pre_tasks:
    - name: Check required BOINC variables
      ansible.builtin.assert:
        that:
          - boinc_project_url is defined
          - boinc_project_url | length > 0
          - boinc_account_key is defined
          - boinc_account_key | length > 0
          - boinc_client_rpc_password is defined
          - boinc_client_rpc_password | length > 0
        fail_msg: "Missing BOINC variables. Run ./scripts/init_config.sh and ./scripts/create_account_db.sh first."

    - name: Check Docker
      ansible.builtin.command: docker version
      changed_when: false

  tasks:
    - name: Stop native BOINC client if installed
      ansible.builtin.shell: |
        systemctl stop boinc-client 2>/dev/null || true
        systemctl disable boinc-client 2>/dev/null || true
        pkill -9 boinc 2>/dev/null || true
      changed_when: false

    - name: Ensure BOINC Docker client directory exists
      ansible.builtin.file:
        path: "{{ boinc_client_data_dir }}"
        state: directory
        mode: "0755"

    - name: Write BOINC client Dockerfile
      ansible.builtin.copy:
        dest: "{{ boinc_client_data_dir }}/Dockerfile"
        mode: "0644"
        content: |
          FROM {{ boinc_client_base_image }}

          RUN apt-get update && \
              apt-get install -y \
                boinc-client \
                ca-certificates \
                curl \
                python3 \
                python3-pip && \
              python3 -m pip install \
                --break-system-packages \
                --no-cache-dir \
                numpy \
                numba && \
              python3 -c "import numpy, numba; print('numpy=' + numpy.__version__); print('numba=' + numba.__version__)" && \
              rm -rf /var/lib/apt/lists/*

          RUN mkdir -p /var/lib/boinc /var/lib/boinc/slots /var/lib/boinc/projects

          CMD ["boinc", "--allow_remote_gui_rpc", "--dir", "/var/lib/boinc"]

    - name: Write Docker Compose file for BOINC client
      ansible.builtin.copy:
        dest: "{{ boinc_client_data_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          services:
            boinc-client:
              build: .
              image: {{ boinc_client_image }}
              container_name: boinc-client
              hostname: "boinc-{{ inventory_hostname | regex_replace('[^A-Za-z0-9-]', '-') }}"
              restart: unless-stopped
              volumes:
                - ./data:/var/lib/boinc
              command: |
                bash -lc "
                  mkdir -p /var/lib/boinc/slots /var/lib/boinc/projects
                  echo '{{ boinc_client_rpc_password }}' > /var/lib/boinc/gui_rpc_auth.cfg
                  exec boinc --allow_remote_gui_rpc --dir /var/lib/boinc
                "

    - name: Remove old BOINC client container
      ansible.builtin.shell: |
        docker rm -f boinc-client 2>/dev/null || true
      changed_when: false

    - name: Reset BOINC client project state
      ansible.builtin.file:
        path: "{{ boinc_client_data_dir }}/data"
        state: absent
      when: boinc_client_reset_state | bool

    - name: Reset BOINC client state if project account changed
      ansible.builtin.shell: |
        DATA_DIR="{{ boinc_client_data_dir }}/data" \
        PROJECT_URL="{{ boinc_project_url }}" \
        ACCOUNT_KEY="{{ boinc_account_key }}" \
        python3 - <<'PY'
        import os
        import shutil
        from pathlib import Path

        data_dir = Path(os.environ["DATA_DIR"])
        state_path = data_dir / "client_state.xml"
        project_url = os.environ["PROJECT_URL"]
        account_key = os.environ["ACCOUNT_KEY"]

        if not state_path.exists():
            raise SystemExit(0)

        state_text = state_path.read_text(encoding="utf-8", errors="replace")
        if project_url in state_text and account_key not in state_text:
            shutil.rmtree(data_dir, ignore_errors=True)
            print("removed stale BOINC client state for changed project account")
            raise SystemExit(2)
        PY
      register: boinc_client_state_account_check
      changed_when: boinc_client_state_account_check.rc == 2
      failed_when: boinc_client_state_account_check.rc not in [0, 2]
      when: not (boinc_client_reset_state | bool)

    - name: Ensure BOINC client data directory exists
      ansible.builtin.file:
        path: "{{ boinc_client_data_dir }}/data"
        state: directory
        mode: "0755"

    - name: Check existing BOINC client image
      ansible.builtin.shell: |
        docker image inspect "{{ boinc_client_image }}" >/dev/null 2>&1
      register: boinc_client_image_check
      failed_when: false
      changed_when: false

    - name: Pull BOINC client base image when local image is missing
      ansible.builtin.shell: |
        docker pull "{{ boinc_client_base_image }}"
      register: boinc_client_base_pull
      changed_when: "'Downloaded newer image' in boinc_client_base_pull.stdout or 'Pull complete' in boinc_client_base_pull.stdout"
      retries: 5
      delay: 20
      until: boinc_client_base_pull.rc == 0
      when: boinc_client_image_check.rc != 0

    - name: Start BOINC client container
      ansible.builtin.shell: |
        cd "{{ boinc_client_data_dir }}"
        if docker image inspect "{{ boinc_client_image }}" >/dev/null 2>&1; then
          COMPOSE_BAKE=false docker compose up -d
        else
          COMPOSE_BAKE=false docker compose up -d --build
        fi
      register: boinc_client_compose_up
      changed_when: true
      retries: 3
      delay: 20
      until: boinc_client_compose_up.rc == 0

    - name: Wait for BOINC client container
      ansible.builtin.shell: |
        docker ps --format '{{ "{{.Names}}" }}' | grep -qx boinc-client
      register: boinc_container_check
      changed_when: false
      retries: 20
      delay: 3
      until: boinc_container_check.rc == 0

    - name: Wait for BOINC RPC inside container
      ansible.builtin.shell: |
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --get_project_status
      register: boinc_rpc_check
      changed_when: false
      retries: 30
      delay: 3
      until: boinc_rpc_check.rc == 0

    - name: Configure BOINC client work-fetch preferences
      ansible.builtin.shell: |
        docker exec -i boinc-client python3 - <<'PY'
        from pathlib import Path

        Path("/var/lib/boinc/global_prefs_override.xml").write_text("""<global_preferences>
          <run_on_batteries>1</run_on_batteries>
          <run_if_user_active>1</run_if_user_active>
          <run_gpu_if_user_active>0</run_gpu_if_user_active>
          <suspend_cpu_usage>0.000000</suspend_cpu_usage>
          <cpu_scheduling_period_minutes>60.000000</cpu_scheduling_period_minutes>
          <work_buf_min_days>0.000000</work_buf_min_days>
          <work_buf_additional_days>0.000000</work_buf_additional_days>
          <max_ncpus_pct>100.000000</max_ncpus_pct>
          <cpu_usage_limit>100.000000</cpu_usage_limit>
          <disk_max_used_gb>100.000000</disk_max_used_gb>
          <disk_max_used_pct>90.000000</disk_max_used_pct>
          <ram_max_used_busy_pct>90.000000</ram_max_used_busy_pct>
          <ram_max_used_idle_pct>90.000000</ram_max_used_idle_pct>
        </global_preferences>
        """, encoding="utf-8")
        PY
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --read_global_prefs_override
      changed_when: true

    - name: Get BOINC project status
      ansible.builtin.shell: |
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --get_project_status
      register: boinc_project_status
      failed_when: false
      changed_when: false

    - name: Attach BOINC Docker client to project
      ansible.builtin.shell: |
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --project_attach "{{ boinc_project_url }}" "{{ boinc_account_key }}"
      when:
        - boinc_project_url not in boinc_project_status.stdout
      register: attach_result
      failed_when:
        - attach_result.rc != 0
        - "'already attached' not in ((attach_result.stdout | default('')) ~ (attach_result.stderr | default('')))"
      changed_when: "'already attached' not in (attach_result.stdout | default(''))"

    - name: Wait after project attach
      ansible.builtin.pause:
        seconds: 5
      when: attach_result is defined

    - name: Request project update
      ansible.builtin.shell: |
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --project "{{ boinc_project_url }}" update
      failed_when: false
      changed_when: false
