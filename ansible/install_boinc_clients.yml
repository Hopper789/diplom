---
- name: Install and attach BOINC clients
  hosts: boinc_clients
  become: true
  gather_facts: true

  vars:
    boinc_client_packages:
      - boinc-client
      - python3
      - python3-pip
      - curl
      - ca-certificates
      - procps
      - psmisc

    boinc_data_dir: /var/lib/boinc-client

  pre_tasks:
    - name: Check supported OS family
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
        fail_msg: "This playbook currently supports Debian/Ubuntu clients only."

    - name: Check apt package manager
      ansible.builtin.shell: command -v apt-get
      register: apt_check
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required client packages
      ansible.builtin.apt:
        name: "{{ boinc_client_packages }}"
        state: present

    - name: Verify required commands
      ansible.builtin.shell: "command -v {{ item }}"
      loop:
        - boinc
        - boinccmd
        - python3
        - curl
      changed_when: false

  tasks:
    - name: Set BOINC data directory for Debian/Ubuntu package
      ansible.builtin.set_fact:
        boinc_data_dir: /var/lib/boinc-client

    - name: Stop BOINC client before changing RPC config
      ansible.builtin.shell: |
        systemctl stop boinc-client || true
        pkill -9 boinc || true
      changed_when: false

    - name: Ensure BOINC directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/lib/boinc-client", owner: "boinc", group: "boinc", mode: "0755" }
        - { path: "/etc/boinc-client", owner: "root", group: "boinc", mode: "0755" }

    - name: Write empty BOINC GUI RPC password
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: ""
        owner: "{{ item.owner }}"
        group: boinc
        mode: "0640"
      loop:
        - { dest: "/var/lib/boinc-client/gui_rpc_auth.cfg", owner: "boinc" }
        - { dest: "/etc/boinc-client/gui_rpc_auth.cfg", owner: "root" }

    - name: Remove BOINC remote_hosts.cfg from common paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/boinc-client/remote_hosts.cfg
        - /etc/boinc-client/remote_hosts.cfg

    - name: Start BOINC client service
      ansible.builtin.shell: |
        systemctl start boinc-client
      changed_when: false

    - name: Wait for BOINC GUI RPC port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 31416
        timeout: 60

    - name: Give BOINC client a few seconds after RPC port opens
      ansible.builtin.pause:
        seconds: 5

    - name: Get BOINC project status
      become: true
      become_user: boinc
      ansible.builtin.shell: |
        cd "{{ boinc_data_dir }}"
        boinccmd --host 127.0.0.1 --get_project_status
      register: boinc_project_status
      failed_when: false
      changed_when: false

    - name: Print BOINC project status before attach
      ansible.builtin.debug:
        var: boinc_project_status.stdout_lines

    - name: Attach BOINC client to project
      become: true
      become_user: boinc
      ansible.builtin.shell: |
        cd "{{ boinc_data_dir }}"
        boinccmd --host 127.0.0.1 --project_attach "{{ boinc_project_url }}" "{{ boinc_account_key }}"
      when:
        - boinc_account_key | length > 0
        - boinc_project_url not in boinc_project_status.stdout
      register: attach_result
      failed_when: false
      changed_when: "'already attached' not in (attach_result.stdout | default(''))"

    - name: Print attach result
      ansible.builtin.debug:
        var: attach_result.stdout_lines
      when: attach_result is defined

    - name: Request project update
      become: true
      become_user: boinc
      ansible.builtin.shell: |
        cd "{{ boinc_data_dir }}"
        boinccmd --host 127.0.0.1 --project "{{ boinc_project_url }}" update
      failed_when: false
      changed_when: false

    - name: Show final BOINC project status
      become: true
      become_user: boinc
      ansible.builtin.shell: |
        cd "{{ boinc_data_dir }}"
        boinccmd --host 127.0.0.1 --get_project_status
      register: final_status
      failed_when: false
      changed_when: false

    - name: Print final BOINC project status
      ansible.builtin.debug:
        var: final_status.stdout_lines