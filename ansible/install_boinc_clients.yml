---
- name: Install and attach BOINC clients in Docker
  hosts: boinc_clients
  become: true
  gather_facts: true

  vars:
    boinc_client_data_dir: /opt/boinc-client
    boinc_client_image: boinc/client:latest

    client_packages:
      - docker.io
      - docker-compose-v2
      - python3
      - curl
      - ca-certificates

  pre_tasks:
    - name: Check supported OS family
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
        fail_msg: "This playbook currently supports Debian/Ubuntu clients only."

    - name: Check required BOINC variables
      ansible.builtin.assert:
        that:
          - boinc_project_url is defined
          - boinc_project_url | length > 0
          - boinc_account_key is defined
          - boinc_account_key | length > 0
          - boinc_client_rpc_password is defined
          - boinc_client_rpc_password | length > 0
        fail_msg: "Missing BOINC variables. Run ./scripts/init_config.sh and ./scripts/create_account_db.sh first."

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ client_packages }}"
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

  tasks:
    - name: Stop native BOINC client if installed
      ansible.builtin.shell: |
        systemctl stop boinc-client 2>/dev/null || true
        systemctl disable boinc-client 2>/dev/null || true
        pkill -9 boinc 2>/dev/null || true
      changed_when: false

    - name: Ensure BOINC Docker client directory exists
      ansible.builtin.file:
        path: "{{ boinc_client_data_dir }}"
        state: directory
        mode: "0755"

    - name: Write Docker Compose file for BOINC client
      ansible.builtin.copy:
        dest: "{{ boinc_client_data_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          services:
            boinc-client:
              image: {{ boinc_client_image }}
              container_name: boinc-client
              restart: unless-stopped
              volumes:
                - ./data:/var/lib/boinc
              command: >
                bash -lc "echo '{{ boinc_client_rpc_password }}' > /var/lib/boinc/gui_rpc_auth.cfg &&
                          boinc --allow_remote_gui_rpc --dir /var/lib/boinc"

    - name: Start BOINC client container
      ansible.builtin.shell: |
        cd "{{ boinc_client_data_dir }}"
        docker compose up -d
      changed_when: true

    - name: Wait for BOINC client container
      ansible.builtin.shell: |
        docker ps --format '{{ "{{.Names}}" }}' | grep -qx boinc-client
      register: boinc_container_check
      changed_when: false
      retries: 20
      delay: 3
      until: boinc_container_check.rc == 0

    - name: Attach BOINC Docker client to project
      ansible.builtin.shell: |
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --project_attach "{{ boinc_project_url }}" "{{ boinc_account_key }}"
      register: attach_result
      failed_when: false
      changed_when: "'already attached' not in (attach_result.stdout | default(''))"

    - name: Print attach result
      ansible.builtin.debug:
        msg:
          rc: "{{ attach_result.rc }}"
          stdout: "{{ attach_result.stdout_lines | default([]) }}"
          stderr: "{{ attach_result.stderr_lines | default([]) }}"

    - name: Request project update
      ansible.builtin.shell: |
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --project "{{ boinc_project_url }}" update
      failed_when: false
      changed_when: false

    - name: Show final BOINC project status
      ansible.builtin.shell: |
        docker exec boinc-client \
          boinccmd --passwd "{{ boinc_client_rpc_password }}" \
          --get_project_status
      register: final_status
      failed_when: false
      changed_when: false

    - name: Print final BOINC project status
      ansible.builtin.debug:
        msg:
          rc: "{{ final_status.rc }}"
          stdout: "{{ final_status.stdout_lines | default([]) }}"
          stderr: "{{ final_status.stderr_lines | default([]) }}"