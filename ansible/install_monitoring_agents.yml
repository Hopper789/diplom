---
- name: Install monitoring agents on BOINC client nodes
  hosts: boinc_clients
  become: true
  gather_facts: true

  vars:
    monitoring_agent_dir: /opt/boinc-monitoring
    monitoring_agent_packages:
      - docker.io
      - docker-compose-v2
      - python3
      - curl
      - ca-certificates

  pre_tasks:
    - name: Check supported OS family
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
        fail_msg: "This playbook currently supports Debian/Ubuntu clients only."

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required monitoring packages
      ansible.builtin.apt:
        name: "{{ monitoring_agent_packages }}"
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

  tasks:
    - name: Ensure monitoring agent directory exists
      ansible.builtin.file:
        path: "{{ monitoring_agent_dir }}"
        state: directory
        mode: "0755"

    - name: Write Docker Compose file for monitoring agents
      ansible.builtin.copy:
        dest: "{{ monitoring_agent_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          services:
            node-exporter:
              image: prom/node-exporter:v1.8.2
              container_name: boinc-node-exporter
              restart: unless-stopped
              network_mode: host
              pid: host
              command:
                - "--path.rootfs=/host"
              volumes:
                - "/:/host:ro,rslave"

            promtail:
              image: grafana/promtail:2.9.8
              container_name: boinc-client-promtail
              restart: unless-stopped
              command:
                - "-config.file=/etc/promtail/promtail.yml"
              volumes:
                - "./promtail.yml:/etc/promtail/promtail.yml:ro"
                - "/var/lib/docker/containers:/var/lib/docker/containers:ro"

    - name: Write Promtail config for client logs
      ansible.builtin.copy:
        dest: "{{ monitoring_agent_dir }}/promtail.yml"
        mode: "0644"
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /tmp/promtail-positions.yaml

          clients:
            - url: http://{{ server_ip }}:3100/loki/api/v1/push

          scrape_configs:
            - job_name: docker
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: docker
                    node: "{{ inventory_hostname }}"
                    node_role: client
                    cluster: boinc
                    __path__: /var/lib/docker/containers/*/*-json.log
              pipeline_stages:
                - docker: {}

    - name: Remove obsolete cAdvisor container
      ansible.builtin.shell: |
        docker rm -f boinc-client-cadvisor 2>/dev/null || true
      changed_when: false

    - name: Start monitoring agent containers
      ansible.builtin.shell: |
        cd "{{ monitoring_agent_dir }}"
        docker compose up -d
      changed_when: true

    - name: Wait for node-exporter
      ansible.builtin.uri:
        url: "http://127.0.0.1:9100/metrics"
        status_code: 200
      register: node_exporter_check
      retries: 20
      delay: 3
      until: node_exporter_check.status == 200

    - name: Show monitoring agent containers
      ansible.builtin.shell: |
        docker ps --filter name=boinc-node-exporter --filter name=boinc-client-promtail
      register: monitoring_agents_status
      changed_when: false

    - name: Print monitoring agent status
      ansible.builtin.debug:
        var: monitoring_agents_status.stdout_lines
