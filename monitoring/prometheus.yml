global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: boinc
    static_configs:
      - targets:
          - boinc-exporter:9101

  - job_name: node_exporter_server
    static_configs:
      - targets:
          - node-exporter:9100

  # monitoring_up.sh перезаписывает этот файл и заполняет цели клиентов из ansible/inventory.ini.
  - job_name: node_exporter_clients
    static_configs:
      - targets: []
