server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          node: control
          node_role: server
          cluster: boinc
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - drop:
          expression: 'caller=(metrics\.go|engine\.go):[0-9]+ .* query='

  - job_name: boinc-project-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: boinc-project-logs
          node: control
          node_role: server
          cluster: boinc
          __path__: /server/project/*/log_boinc-server/*.log
