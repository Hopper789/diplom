services:
  boinc-exporter:
    build: .
    image: monitoring-boinc-exporter:latest
    container_name: boinc-exporter
    env_file:
      - .env
    ports:
      - "9101:9101"
    networks:
      - server_default
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: boinc-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - boinc-exporter
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: boinc-loki
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: boinc-promtail
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: boinc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ID: "1"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_ROOT_URL: "http://${SERVER_IP:-localhost}:3000"
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
      - grafana-renderer
    restart: unless-stopped

  grafana-renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: boinc-grafana-renderer
    environment:
      ENABLE_METRICS: "true"
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: boinc-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    name: boinc_monitoring
  server_default:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
