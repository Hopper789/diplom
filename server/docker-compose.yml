services:
  mariadb:
    image: mariadb:10.11
    container_name: boinc-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./mariadb-data:/var/lib/mysql

  boinc-server:
    build: .
    image: boinc-server-build
    container_name: boinc-server
    hostname: boinc-server
    depends_on:
      - mariadb
    volumes:
      - ./project:/project
    ports:
      - "${PROJECT_PORT:-8080}:80"
    tty: true
    stdin_open: true
